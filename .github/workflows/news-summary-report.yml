name: News Executive Summary Report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-summary-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: pip install --quiet matplotlib
      - name: Build report
        run: |
          mkdir -p data/reports
          python3 scripts/news_summary_pdf.py data/news.json "data/reports/news-summary-$(date -u +%Y-%m-%d-%H%M%S).pdf"
      - name: Commit report
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/reports data/news-summary-reports.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "news-summary: report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push news-summary report after 3 attempts, likely racing a concurrent run. Re-run the report generation."
