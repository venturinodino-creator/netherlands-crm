name: Daily Netherlands Competitor Hiring Scan

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: competitor-jobs-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run competitor hiring scan
        env:
          # Only used for the private roles-for-you shortlist, which is
          # written to Supabase behind RLS rather than into this public repo.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # This repo owns the shortlist; Belgium and Denmark skip it so the
          # three scans do not fight over the same rows or send three emails.
          PERSONAL_SHORTLIST: '1'
          # Outside the workspace, so the digest can never be committed.
          ROLES_DIGEST_PATH: ${{ runner.temp }}/roles-digest.html
        run: node scripts/competitor-jobs-scan.js

      # Email the new roles. Nothing is echoed: the digest is read from a file
      # the step above wrote outside the repo, because Actions logs on a public
      # repo are public. Skipped entirely when the mail secrets are absent.
      - name: Check for a roles digest
        id: digest
        run: |
          if [ -s "${{ runner.temp }}/roles-digest.html" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Email new roles
        if: steps.digest.outputs.found == 'true' && env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Research CRM <${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: New roles matching your profile
          html_body: file://${{ runner.temp }}/roles-digest.html
          convert_markdown: false
      - name: Commit new hiring findings
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/competitor-jobs.json data/competitor-jobs-scan-state.json
          [ -f data/archive/competitor-jobs.json ] && git add data/archive/competitor-jobs.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "competitor-jobs: auto-scan $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run of this workflow) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push competitor-jobs-scan results after 3 attempts, likely racing a concurrent run of this same workflow. This run's findings were not saved, but they'll resurface on the next scan."
