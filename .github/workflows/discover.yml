name: Daily Contact Discovery
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run contact discovery
        run: node scripts/discover.js
      - name: Commit new contacts
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/pending-contacts.json data/discovery-state.json
          git diff --staged --quiet || git commit -m "contacts: auto-discover $(date +%Y-%m-%d)"
          git push
